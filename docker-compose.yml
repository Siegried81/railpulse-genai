services:
  railpulse:
    build: .
    # build + image: `docker compose up --build` builds from source and tags it with the
    # Docker Hub name; `docker compose pull` downloads the published image instead.
    image: ${DOCKERHUB_USERNAME:-siegried}/railpulse-genai:latest
    container_name: railpulse-ai
    ports:
      # Host port: each app has its own, so all of them can run at once.
      # Override with UI_PORT in .env; the app still listens on 8501 inside.
      - "${UI_PORT:-8503}:8501"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./.streamlit:/app/.streamlit
    # env_file loads the API keys from the local, gitignored .env
    # (see .env.example for the variable names).
    # Optional: someone who pulled the image has no .env, and the UI must still start.
    env_file:
      - path: .env
        required: false
    environment:
      # Values here OVERRIDE the same keys in .env: the container always runs
      # on Groq (faster and more reliable than a CPU-only Ollama), whatever
      # LLM_PROVIDER says in .env. Remove these two lines to let .env decide.
      - LLM_PROVIDER=groq
      - GROQ_MODEL=openai/gpt-oss-120b

      # Database path (inside container)
      - DB_PATH=data/railpulse_ai.db
    networks:
      - railpulse-net

networks:
  railpulse-net:
    driver: bridge